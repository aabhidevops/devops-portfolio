apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-pipeline
  labels:
    app: devops-pipeline
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devops-pipeline
  template:
    metadata:
      labels:
        app: devops-pipeline
    spec:
      containers:
      - name: devops-pipeline
        image: aabhidevops/devops-pipeline:v1
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: devops-app-config
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
